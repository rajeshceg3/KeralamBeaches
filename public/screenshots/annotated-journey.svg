<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#061a24"/><rect width="1440" height="900" fill="url(#a)" opacity=".95"/><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad493c"/><stop offset=".45" stop-color="#36ccd9"/><stop offset="1" stop-color="#0e5f4a"/></linearGradient><radialGradient id="b"><stop stop-color="#fff1b0"/><stop offset=".45" stop-color="#40d2d8"/><stop offset="1" stop-color="#ef8458" stop-opacity="0"/></radialGradient></defs><ellipse cx="720" cy="450" rx="520" ry="245" fill="url(#b)" opacity=".8"/><text x="120" y="360" fill="white" font-family="Georgia" font-size="86" font-weight="700" letter-spacing="-5">Liquid light dissolves</text><text x="120" y="450" fill="white" font-family="Georgia" font-size="86" font-weight="700" letter-spacing="-5">each cove into the next.</text><g fill="none" stroke="#fff3c9" stroke-width="4" opacity=".45"><path d="M0 610 C180 565 290 635 470 600 S800 565 1020 620 1270 675 1440 625"/><path d="M0 710 C220 665 380 735 600 700 S970 665 1440 735"/></g><g font-family="Inter,Arial" font-size="26" font-weight="700"><rect x="70" y="68" width="480" height="96" rx="18" fill="#061a24" opacity=".84"/><text x="96" y="107" fill="#ffe7a6">1. Fluid morph transition</text><text x="96" y="140" fill="white" font-size="18">A luminous ribbon bridges Varkala, Kovalam, and Alleppey.</text><path d="M390 166 L630 385" stroke="#ffe7a6" stroke-width="4"/><rect x="820" y="640" width="492" height="102" rx="18" fill="#061a24" opacity=".84"/><text x="846" y="680" fill="#ffe7a6">2. Multi-layer parallax tides</text><text x="846" y="713" fill="white" font-size="18">Stacked reflective waves imply depth during scroll.</text><path d="M980 638 L875 600" stroke="#ffe7a6" stroke-width="4"/></g></svg>
